<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="app-favicon" type="image/png" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WhatsAtendende</title>

    <!-- Lets the app be added to the home screen and open without browser
         chrome (address bar/tabs), like a native app — see PROMPT: "abrir
         em layout de aplicativo". manifest.webmanifest covers Android/
         Chrome; the apple-* tags cover iOS/Safari, which ignores the web
         manifest for this. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0097B4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WhatsAtendende" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
