server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build output is content-hashed (e.g. index-abc123.js) — a
    # different build gets a different filename, so these can be cached
    # forever with zero risk of ever serving a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html references the CURRENT build's hashed filenames, so it
        # must never be served stale from a browser (or intermediate) cache —
        # without this, a phone that already had the app open could keep
        # running an old JS bundle indefinitely, through any number of
        # deploys, with nothing short of a manual hard-refresh ever fetching
        # the new one.
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads {
        proxy_pass http://api:4000;
    }

    location /socket.io {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
