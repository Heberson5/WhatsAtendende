server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the HTML page and static assets — the API sets
    # its own equivalents (helmet()) on its JSON responses, but those never
    # covered what nginx itself serves directly.
    # - frame-ancestors 'none' (clickjacking: this app is never meant to be
    #   embedded in someone else's page/iframe — no legitimate reason to
    #   allow it) + the older X-Frame-Options for browsers that predate CSP
    #   frame-ancestors support. This is the opposite direction from
    #   frame-src below (embedding US vs. what WE embed).
    # - X-Content-Type-Options stops a browser from ever guessing a
    #   different (and executable) MIME type for something served here.
    # - Referrer-Policy keeps the app's own URLs (which can carry a
    #   password-reset token as a query string) out of the Referer header
    #   sent to any third-party resource a page might load.
    # - frame-src carves out the one legitimate external embed the app
    #   makes: OpenStreetMap's own preview iframe before sending a
    #   location message (Composer.tsx).
    # - img-src allows WhatsApp's own CDN: contact/customer profile photos
    #   are stored as the *.whatsapp.net URL Baileys returns, never
    #   downloaded and re-served by this app — see contact.photoUrl.
    #   Message attachments (images/audio/etc the agent actually sends or
    #   receives) ARE downloaded and served from this same origin, so they
    #   need no extra allowance here.
    # - style-src keeps 'unsafe-inline': the UI sets a lot of per-element
    #   inline styles (React's `style` prop — dynamic colors, positioned
    #   popovers, etc.), which a stricter policy would need a build-time
    #   nonce/hash pipeline to keep working. script-src deliberately has NO
    #   such exception — that's the directive that actually matters against
    #   XSS (blocks inline <script>, onclick=, eval, new Function), and it
    #   stays at the strict default-src 'self' with nothing loosened.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; frame-src https://www.openstreetmap.org; img-src 'self' data: https://*.whatsapp.net; style-src 'self' 'unsafe-inline'" always;

    # Vite's build output is content-hashed (e.g. index-abc123.js) — a
    # different build gets a different filename, so these can be cached
    # forever with zero risk of ever serving a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html references the CURRENT build's hashed filenames, so it
        # must never be served stale from a browser (or intermediate) cache —
        # without this, a phone that already had the app open could keep
        # running an old JS bundle indefinitely, through any number of
        # deploys, with nothing short of a manual hard-refresh ever fetching
        # the new one.
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this, the API (behind TRUST_PROXY=true) falls back to
        # seeing every request as coming from this nginx container's own
        # address — every real client collapses into one shared identity
        # for rate limiting (one busy user can exhaust everyone else's
        # quota) and every audit-log entry records the wrong IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://api:4000;
    }

    location /socket.io {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
